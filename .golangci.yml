# golangci-lint v2 configuration.
# PRD requirement (§11, Definition of Done): zero warning.
version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose # tile downloads must not leak response bodies (§6.8)
    - depguard # mechanically enforces the dependency ban of §4.1
    - errorlint # enforces %w and errors.Is over == (§4.2)
    - gocritic
    - misspell
    - nilerr
    - predeclared
    - revive

  settings:
    depguard:
      rules:
        # An allow list is exclusive: anything absent is refused, which is the
        # shape of the §4.1 rule. It therefore has to name the standard library
        # and the module itself, or every import in the repository is flagged.
        # Entries are prefixes, so "carnet" covers every internal package.
        allowed-by-prd:
          allow:
            - $gostd
            - carnet
            - golang.org/x/image
            - gopkg.in/yaml.v3
          # Redundant against the allow list above, kept for the message: these
          # four are the ones a future contributor would reach for.
          deny:
            - pkg: github.com/flopp/go-staticmaps
              desc: "PRD §4.1: map assembly is written by hand, that is the point of the project"
            - pkg: github.com/fogleman/gg
              desc: "PRD §4.1: rasterisation goes through golang.org/x/image/vector"
            - pkg: github.com/tkrajina/gpxgo
              desc: "PRD §4.1: GPX parsing goes through encoding/xml"

    errorlint:
      errorf: true # flags %v used where %w is meant
      asserts: true # flags err.(*T) instead of errors.As
      comparison: true # flags err == target instead of errors.Is

    gocritic:
      enabled-tags:
        - diagnostic
        - style

formatters:
  enable:
    - gofmt
    - goimports
